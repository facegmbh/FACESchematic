name: Deploy FACESchematic (face-docker1)

# Push auf master -> der self-hosted Runner auf face-docker1 (192.168.100.70)
# baut das Image und startet den Container neu. Der private LAN-Server ist von
# GitHub-Cloud-Runnern nicht erreichbar, daher Build+Deploy direkt auf dem Host.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: faceschematic-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, faceschematic]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Die BHE-Symbolbibliothek liegt bewusst NICHT im Repository: die Zeichnungen sind
      # Mitgliedsmaterial des BHE, und dieses Repository ist oeffentlich. Sie auf Plaenen
      # zu verwenden ist etwas anderes, als sie zu veroeffentlichen.
      #
      # Sie liegen stattdessen auf face-docker1 neben dem Runner (erzeugt mit
      # tools/bheSymbols.mjs von der Mitglieder-CD: die SVGs plus catalog.json) und werden
      # hier in den Checkout kopiert, bevor das Image gebaut wird. Fehlen sie, laeuft der
      # Build trotzdem durch: die App sagt dann im Symbol-Dialog, dass die Bibliothek nicht
      # installiert ist, und jedes Geraet behaelt seine gezeichnete Form.
      - name: BHE-Symbole einsetzen (nicht in git)
        run: |
          for src in "$HOME/faceschematic/bhe" /srv/faceschematic/bhe; do
            [ -f "$src/catalog.json" ] || continue
            mkdir -p public/symbols
            rm -rf public/symbols/bhe
            cp -r "$src" public/symbols/bhe
            echo "BHE: $(find public/symbols/bhe -name '*.svg' | wc -l) Symbole aus $src"
            exit 0
          done
          echo "BHE: keine Symbolbibliothek auf diesem Host — Build ohne sie"

      - name: Build & deploy (docker compose)
        run: docker compose -p faceschematic up -d --build --remove-orphans

      - name: Prune dangling images
        run: docker image prune -f

      - name: Healthcheck
        run: |
          sleep 3
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080)
          echo "http://localhost:8080 -> $code"
          test "$code" = "200"
