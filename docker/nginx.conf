server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # --- FACE: security headers ----------------------------------------------
    # public/_headers carries these for Cloudflare, which we do not use — served
    # from here they were simply absent, so until now any site could frame the
    # app. Odoo embeds the drawing viewer (?embed=1), so frame-ancestors names the
    # portal plus Odoo.sh staging — whose hostname carries a build id that changes
    # on every rebuild, hence the wildcard. The viewer only renders what its
    # embedder hands it and never sends a drawing back, so an unexpected embedder
    # gains nothing.
    #
    # connect-src is 'self' only: the device library goes through our own /api
    # proxy, so the app never talks to a third party directly.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self'; worker-src 'self'; frame-ancestors 'self' https://portal.face-gmbh.com https://*.dev.odoo.com" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # -------------------------------------------------------------------------

    # --- FACE: only the device library may leave the house --------------------
    # The upstream API serves both the harmless device library (GET /templates)
    # and the account/upload endpoints (/auth, /schematics, /drafts,
    # /submissions, /shared). Our drawings carry customer installations with
    # locations and serial numbers, so uploading them to a third party is out.
    #
    # The app is built with VITE_TEMPLATE_API_URL=/api (see Dockerfile), so every
    # API call lands here and is decided by path — not by which menu items the UI
    # happens to offer. An upstream merge that restores a cloud menu item cannot
    # re-open this route.
    location = /api/templates {
        limit_except GET HEAD { deny all; }
        proxy_pass https://api.easyschematic.live/templates;
        proxy_set_header Host api.easyschematic.live;
        proxy_ssl_server_name on;
        # Never carry a session upstream, in either direction.
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_connect_timeout 10s;
        proxy_read_timeout 20s;
    }

    # ^~ so the regex location below can never claim an /api/ path.
    location ^~ /api/ {
        return 403;
    }
    # -------------------------------------------------------------------------

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
